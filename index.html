<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>我们的地图</title>
<meta name="description" content="我们的故事，从你亲我的那一口开始了。" />
<meta property="og:title" content="我们的地图" />
<meta property="og:description" content="我们的故事，从你亲我的那一口开始了。33 段回忆，60 张照片。" />
<meta property="og:image" content="https://123344279.github.io/our-map/photos/xian/07.jpg" />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0f14'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='21' fill='%23d3704f' text-anchor='middle'%3EJ%26W%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="stylesheet" href="assets/theme-paper.css" />
</head>
<body data-level="country">

<div class="cover" id="cover">
  <div class="cover-bg"></div>
  <div class="cover-inner">
    <p class="cover-eyebrow">J &amp; W · 2024 — 2026</p>
    <h1 class="cover-title">我们的地图</h1>
    <p class="cover-line">我们的故事，从你亲我的那一口开始了</p>
    <button class="cover-btn" id="coverBtn" type="button">进去看看<span class="ar">→</span></button>
  </div>
  <p class="cover-foot">33 段回忆 · 60 张照片 · 3 个省 6 座城</p>
</div>

<div class="app">

  <section class="stage" aria-label="中国地图">
    <svg id="map" role="img" aria-label="中国地图，可点击省份放大">
      <defs>
        <radialGradient id="vign" cx="50%" cy="45%" r="65%">
          <stop offset="60%" stop-color="#000" stop-opacity="0" />
          <stop offset="100%" stop-color="#000" stop-opacity=".55" />
        </radialGradient>
      </defs>
      <rect id="bg" x="-4000" y="-4000" width="12000" height="12000" fill="transparent" />
      <g id="gProv"></g>
      <g id="gGrat"></g>
      <g id="gXian"></g>
      <g id="gXianImg"></g>
      <g id="gPins"></g>
      <g id="gSea"></g>
      <g id="gRoutes"></g>
      <g id="gMarks"></g>
      <g id="gLabels"></g>
      <rect class="vignette" x="-4000" y="-4000" width="12000" height="12000" fill="url(#vign)" pointer-events="none" />
    </svg>

    <header class="brand">
      <p class="eyebrow" id="brandEyebrow">OUR MAP</p>
      <h1 id="brandTitle">我们的地图</h1>
      <p class="brand-sub" id="brandSub">把一起走过的地方，钉在这张图上</p>
      <p class="brand-mark">J &amp; W</p>
    </header>

    <button id="back" class="back" type="button"><span class="ar">←</span><span id="backText">返回全国</span></button>

    <div class="zoombox" id="zoombox">
      <button id="zin" type="button" aria-label="放大">＋</button>
      <button id="zout" type="button" aria-label="缩小">－</button>
    </div>

    <div class="legend">
      <span class="lg"><i class="lg-dot"></i>走过的地方</span>
      <span class="lg"><i class="lg-line"></i>先后的顺序</span>
      <p class="lg-hint">点省份放大 · 点圆点看回忆</p>
    </div>

    <figure class="inset" id="inset"><figcaption>南海诸岛</figcaption></figure>

    <div class="tip" id="tip" role="status"></div>
  </section>

  <aside class="panel">
    <button class="sheet-handle" id="sheetHandle" type="button" aria-label="展开或收起">
      <span class="bar"></span>
      <span class="chev">⌄</span>
      <span class="hint-text" id="sheetHint">目录</span>
    </button>
    <div class="panel-head">
      <nav class="crumbs" id="crumbs" aria-label="位置"></nav>
      <h2 class="p-title" id="pTitle"></h2>
      <p class="p-sub" id="pSub"></p>
    </div>
    <div class="p-body" id="pBody"></div>
    <div class="p-foot" id="pFoot"></div>
  </aside>

</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片">
  <button class="lb-close" type="button" aria-label="关闭">✕</button>
  <div class="lb-stage"><img id="lbImg" alt="" /></div>
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-prev" type="button" aria-label="上一张">‹</button>
  <button class="lb-next" type="button" aria-label="下一张">›</button>
</div>

<div class="grain" aria-hidden="true"></div>

<script src="assets/map-data.js"></script>
<script src="assets/cities.js"></script>
<script src="assets/xian.js"></script>
<script src="data/memories.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
